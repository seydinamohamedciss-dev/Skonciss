<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SKONCISS">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>SKONCISS AFRIKA Business Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concept : outil de comptoir. En-tête sobre, grosses cibles tactiles, chiffres en police d'affichage,
   fond vert-gris froid, vert profond de marque, jaune soleil réservé aux alertes douces. */
:root{
  --bg:#F0EFEA; --card:#FFFFFF; --ink:#111111; --mut:#5E5B52; --line:#DDDAD0;
  --brand:#D4A62A; --on-brand:#111111; --brand-soft:#F6E9BE; --brand-bar:#E7CB7A; --brand-fg:#7A5A00;
  --hero:#0D0D0D; --on-hero:#F5E7B8; --hero-mut:#B59A4A;
  --good:#17803F; --good-bg:#DDF2E4; --warn:#8F5600; --warn-bg:#FBEACB;
  --bad:#B3321F; --bad-bg:#F9DDD8; --info:#2B5FA8; --info-bg:#DCE8F8; --neutral-bg:#E8E6DE;
  --shadow:0 1px 2px rgba(17,17,17,.06),0 6px 18px rgba(17,17,17,.06);
  --font-d:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --card:#151515; --ink:#F2EFE6; --mut:#A39F90; --line:#2A2A26;
  --brand:#E3B63C; --on-brand:#111111; --brand-soft:#2A2410; --brand-bar:#6B5718; --brand-fg:#E3B63C;
  --hero:#1A1708; --on-hero:#F5E7B8; --hero-mut:#B59A4A;
  --good:#5FD38A; --good-bg:#14301F; --warn:#F0B64D; --warn-bg:#35280F;
  --bad:#FF8C78; --bad-bg:#3A1A15; --info:#8DB8F5; --info-bg:#16283F; --neutral-bg:#1E1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --card:#151515; --ink:#F2EFE6; --mut:#A39F90; --line:#2A2A26;
  --brand:#E3B63C; --on-brand:#111111; --brand-soft:#2A2410; --brand-bar:#6B5718; --brand-fg:#E3B63C;
  --hero:#1A1708; --on-hero:#F5E7B8; --hero-mut:#B59A4A;
  --good:#5FD38A; --good-bg:#14301F; --warn:#F0B64D; --warn-bg:#35280F;
  --bad:#FF8C78; --bad-bg:#3A1A15; --info:#8DB8F5; --info-bg:#16283F; --neutral-bg:#1E1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:0;padding-bottom:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:720px;margin:0 auto}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px}
.top-in{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:#000;display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.ttl{min-width:0;flex:1}
.ttl small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.ttl h1{font:700 21px/1.15 var(--font-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.sv{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sv i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sv.off i{background:var(--bad)}
main{padding-block:6px 110px;display:flex;flex-direction:column;gap:14px;min-height:60vh}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
#nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--mut);font-size:11.5px;font-weight:600;min-height:54px;position:relative}
#nav button.on{color:var(--brand-fg);background:var(--brand-soft)}
#nav .bd{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font:700 17px var(--font-d)}
.sec-h small,.mut{color:var(--mut);font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrapx{flex-wrap:wrap}
.hero{background:var(--hero);color:var(--on-hero);border-radius:20px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px}
.hero small{color:var(--hero-mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.hero .big{font:800 34px/1.05 var(--font-d);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hero .big span{font-size:15px;font-weight:600;opacity:.8;margin-left:4px}
.hero .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.hero .trio b{display:block;font:700 15.5px var(--font-d);font-variant-numeric:tabular-nums}
.hero .trio small{display:block;font-size:10.5px;margin-bottom:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.tile small{color:var(--mut);font-size:12px;font-weight:600}
.tile b{font:700 20px/1.1 var(--font-d);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile em{font-style:normal;font-size:12px;color:var(--mut)}
.tile.warn{border-color:var(--warn);background:var(--warn-bg)}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)}
button.tile{cursor:pointer;color:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;min-height:40px;color:var(--ink)}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px;color:var(--mut)}
.search input{border:0;background:none;flex:1;min-width:0;outline:none;min-height:44px;color:var(--ink)}
.tools{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:0 16px;min-height:48px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.p{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.d{color:var(--bad);border-color:var(--bad)}
.btn.s{min-height:40px;padding:0 12px;font-size:13.5px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.p{color:var(--on-brand)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btns .full{grid-column:1/-1}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:15;height:54px;border-radius:27px;border:0;background:var(--brand);color:var(--on-brand);font-weight:700;padding:0 20px 0 16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(212,166,42,.4)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.pill.neutral{background:var(--neutral-bg);color:var(--mut)}
.item{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:inherit}
.item .th{width:52px;height:52px;border-radius:12px;background:var(--brand-soft);color:var(--brand-fg);display:grid;place-items:center;font:700 19px var(--font-d);flex:none;overflow:hidden}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .nm{font-weight:700;overflow-wrap:anywhere}
.item .sub{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.item .amt{font:700 16px var(--font-d);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .amt small{display:block;font:500 11.5px var(--font-b);color:var(--mut)}
.list{display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:26px 14px;color:var(--mut);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font:700 17px var(--font-d);color:var(--ink)}
.alert{display:flex;gap:10px;align-items:center;border-radius:12px;padding:11px 12px;text-align:left;width:100%;border:0;font-weight:600;font-size:13.5px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.info{background:var(--info-bg);color:var(--info)}
.alert svg{flex:none;width:20px;height:20px}
.alert span{flex:1}
.note{font-size:12.5px;color:var(--mut);background:var(--neutral-bg);border-radius:10px;padding:9px 11px}
.hb{display:flex;flex-direction:column;gap:11px}
.hb .l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.hb .l span:first-child{overflow-wrap:anywhere;min-width:0}
.hb .l b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb .t{height:8px;border-radius:4px;background:var(--neutral-bg);margin-top:4px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--brand);border-radius:4px}
svg.vb text{fill:var(--mut);font:600 10px var(--font-b)}
svg.vb .b{fill:var(--brand-bar)}svg.vb .b.last{fill:var(--brand)}
svg.vb line{stroke:var(--line);stroke-width:1}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .item .th{background:var(--neutral-bg);color:var(--ink)}
/* feuilles et formulaires */
#sheet .scrim{position:fixed;inset:0;background:rgba(5,15,14,.55);z-index:40}
#sheet .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;max-height:94%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 8px 18px}
.sh-head h2{font:700 19px var(--font-d)}
.sh-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.f{display:flex;flex-direction:column;gap:5px}
.f>span{font-size:13px;font-weight:600;color:var(--mut)}
.f>span b{color:var(--bad)}
.f small{color:var(--mut);font-size:12px}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;min-height:48px;width:100%;outline:none}
.f textarea{padding:10px 12px;min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.search:focus-within,.btn:focus-visible,.chip:focus-visible,.item:focus-visible,#nav button:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut)}
.kv b{font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.kv.tot{font:700 17px var(--font-d)}
.kv.tot span:first-child{color:var(--ink)}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .g2{grid-column:1/-1}
.lh{font-weight:700;overflow-wrap:anywhere}
.x{border:0;background:var(--bad-bg);color:var(--bad);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.photo-prev{width:84px;height:84px;border-radius:14px;background:var(--brand-soft);overflow:hidden;display:grid;place-items:center;color:var(--brand-fg)}
.photo-prev img{width:100%;height:100%;object-fit:cover}
#dlg{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,15,14,.6)}
#dlg.on{display:flex}
#dlg .box{background:var(--card);border-radius:18px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
#dlg h3{font:700 18px var(--font-d)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;max-width:min(92vw,520px);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--hero);color:var(--on-hero);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast div.err{background:var(--bad);color:#fff}
#lock{position:fixed;inset:0;z-index:80;background:var(--hero);color:var(--on-hero);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#lock.on{display:flex}
#lock input{width:220px;text-align:center;font:700 26px var(--font-d);letter-spacing:.4em;min-height:56px;border-radius:14px;border:0;padding:0 10px;background:#fff;color:#0E1E1D}
#lock .logo{width:120px;height:120px;border-radius:26px}
.hr{height:1px;background:var(--line);border:0;margin:2px 0}
.tl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.tl div{display:flex;justify-content:space-between;gap:10px}
.item.late{border-color:var(--bad)}
#upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--hero);color:var(--on-hero);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:92vw}
.strike{text-decoration:line-through;opacity:.6}
.dayh{font:700 13px var(--font-d);color:var(--mut);display:flex;justify-content:space-between;padding:6px 2px 0}
pre.csv{white-space:pre-wrap;word-break:break-all;font-size:11.5px;max-height:240px;overflow:auto;background:var(--neutral-bg);padding:10px;border-radius:10px}
@media (prefers-reduced-motion:no-preference){#sheet .sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>

<div class="wrap" id="app">
  <header id="top"></header>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="dlg"></div>
<div id="toast" aria-live="polite"></div>

/* ---- journal des modifications importantes ---- */
function L(action, ref, detail) { S.log.push({ id: uid('l'), date: nowIso(), action, ref: ref || '', detail: detail || '' }); if (S.log.length > 3000) S.log.splice(0, S.log.length - 3000); }

/* ---- accès ---- */
const prod = id => S.products.find(p => p.id === id);
const ord = id => S.orders.find(o => o.id === id) || err('Commande introuvable.');
const chName = id => (S.channels.find(c => c.id === id) || { name: '—' }).name;
const reservedOf = pid => S.orders.reduce((s, o) => o.reserved ? s + sum(o.items.filter(i => i.pid === pid), i => i.qty) : s, 0);
const availOf = p => p.qty - reservedOf(p.id);
const stockState = p => { const a = availOf(p); return a <= 0 ? 'out' : a <= p.alert ? 'low' : 'ok'; };
const costOf = p => p.buy + p.imp;

/* ---- calculs de commande ---- */
const itemsTotal = o => sum(o.items, i => i.qty * i.price);
const orderTotal = o => Math.max(0, itemsTotal(o) - (o.discount || 0) + (o.shipFee || 0));
const paidOf = o => sum(o.payments.filter(p => !p.void), p => p.amount);
const inactive = o => o.status === 'Annulée' || o.status === 'Retournée';
const remaining = o => inactive(o) ? 0 : Math.max(0, orderTotal(o) - paidOf(o));
const payStatus = o => { const p = paidOf(o); return p <= 0 ? 'Non payé' : p >= orderTotal(o) ? 'Payé' : 'Partiel'; };

/* ---- mouvement de stock (seul point de modification des quantités) ---- */
function mv(p, type, dq, dr, note, ref, val) {
  if (p.qty + dq < 0) err('Stock négatif impossible pour ' + p.name + '.');
  p.qty += dq;
  S.moves.push({ id: uid('m'), date: nowIso(), pid: p.id, name: p.name, type, dq, dr, after: p.qty, note: note || '', ref: ref || '', val: val || 0 });
}

const A = {};

/* ================= PRODUITS ================= */
function cleanProduct(d, cur) {
  const name = (d.name || '').trim(); if (!name) err('Le nom du produit est obligatoire.');
  const buy = num(d.buy), imp = num(d.imp), price = num(d.price), alert = d.alert === '' || d.alert == null ? S.settings.lowDefault : num(d.alert);
  if (buy < 0 || imp < 0 || price < 0 || alert < 0) err('Les montants ne peuvent pas être négatifs.');
  let sku = (d.sku || '').trim();
  if (sku && S.products.some(p => p.id !== (cur && cur.id) && p.sku.toLowerCase() === sku.toLowerCase())) err('Cette référence existe déjà.');
  const cat = (d.newcat || '').trim() || d.cat || 'Autres';
  if (!S.cats.includes(cat)) S.cats.push(cat);
  return { name, sku, buy, imp, price, alert, cat, supplier: (d.supplier || '').trim(), channel: d.channel || '', desc: (d.desc || '').trim() };
}
A.addProduct = d => {
  const c = cleanProduct(d); const q0 = num(d.qty0); if (q0 < 0) err('La quantité initiale est invalide.');
  if (S.products.some(p => p.name.toLowerCase() === c.name.toLowerCase() && !p.archived && p.sku === c.sku && Date.now() - Date.parse(p.added) < 8000)) err('Produit déjà ajouté à l\'instant.');
  if (!c.sku) c.sku = 'SK-' + pad(++S.seq.sku, 4);
  const p = { id: uid('p'), ...c, photo: d.photo || '', qty0: q0, qty: 0, added: nowIso(), archived: false };
  S.products.push(p);
  mv(p, 'initial', q0, 0, 'Quantité initiale', p.id);
  L('Produit créé', p.name, 'Stock initial ' + q0);
  return p;
};
A.updateProduct = (id, d) => {
  const p = prod(id) || err('Produit introuvable.'); const c = cleanProduct(d, p);
  const changed = ['buy','imp','price'].filter(k => p[k] !== c[k]).map(k => k + ' ' + p[k] + '→' + c[k]).join(', ');
  Object.assign(p, c); if (d.photo !== undefined && d.photo !== null) p.photo = d.photo;
  L('Produit modifié', p.name, changed);
  return p;
};
A.archiveProduct = id => {
  const p = prod(id) || err('Produit introuvable.');
  if (reservedOf(id) > 0) err('Des commandes ont réservé ce produit.');
  p.archived = true; L('Produit archivé', p.name, 'Stock restant ' + p.qty);
};
A.moveStock = (pid, d) => {
  const p = prod(pid) || err('Produit introuvable.'); const q = num(d.qty), note = (d.note || '').trim();
  if (d.type === 'entree') {
    if (q < 1) err('Quantité invalide.');
    const nb = d.buy === '' || d.buy == null ? null : num(d.buy), ni = d.imp === '' || d.imp == null ? null : num(d.imp);
    if (nb != null && nb < 0 || ni != null && ni < 0) err('Prix invalide.');
    if (nb != null || ni != null) { // coût moyen pondéré
      const tot = p.qty + q;
      if (nb != null) p.buy = Math.round((p.qty * p.buy + q * nb) / tot);
      if (ni != null) p.imp = Math.round((p.qty * p.imp + q * ni) / tot);
    }
    mv(p, 'entree', q, 0, note || 'Entrée de stock'); L('Entrée de stock', p.name, '+' + q);
  } else if (d.type === 'sortie') {
    if (q < 1) err('Quantité invalide.'); if (!note) err('Indiquez le motif de la sortie.');
    if (q > availOf(p)) err('Sortie impossible : seulement ' + availOf(p) + ' disponible(s) (le reste est réservé).');
    mv(p, 'sortie', -q, 0, note); L('Sortie de stock', p.name, '-' + q + ' (' + note + ')');
  } else if (d.type === 'ajustement') {
    if (d.qty === '' || d.qty == null || q < 0) err('Indiquez la quantité comptée.'); if (!note) err('La justification est obligatoire pour corriger un inventaire.');
    if (q < reservedOf(pid)) err('La quantité comptée est inférieure au stock réservé (' + reservedOf(pid) + ').');
    const dq = q - p.qty; if (dq === 0) err('La quantité comptée est identique au stock enregistré.');
    mv(p, 'ajustement', dq, 0, note); L('Inventaire corrigé', p.name, p.qty - dq + '→' + p.qty + ' (' + note + ')');
  } else err('Type de mouvement inconnu.');
  return p;
};

/* ================= CLIENTS ================= */
function upsertCustomer(name, phone, zone) {
  const dg = digits(phone);
  let c = dg ? S.customers.find(x => digits(x.phone) === dg) : S.customers.find(x => !digits(x.phone) && x.name.toLowerCase() === name.toLowerCase());
  if (!c) { c = { id: uid('c'), name, phone: (phone || '').trim(), zone: (zone || '').trim(), created: nowIso() }; S.customers.push(c); }
  else if (zone && !c.zone) c.zone = zone;
  return c;
}
A.saveCustomer = (id, d) => {
  const name = (d.name || '').trim(); if (!name) err('Le nom est obligatoire.');
  const dg = digits(d.phone);
  if (dg && S.customers.some(c => c.id !== id && digits(c.phone) === dg)) err('Un client avec ce téléphone existe déjà.');
  if (id) { const c = S.customers.find(x => x.id === id); Object.assign(c, { name, phone: (d.phone || '').trim(), zone: (d.zone || '').trim() }); L('Client modifié', name); return c; }
  const c = { id: uid('c'), name, phone: (d.phone || '').trim(), zone: (d.zone || '').trim(), created: nowIso() }; S.customers.push(c); L('Client créé', name); return c;
};
const custOrders = c => S.orders.filter(o => o.custId === c.id);

/* ================= COMMANDES ================= */
function doReserve(o) {
  if (o.reserved) return;
  for (const i of o.items) { const p = prod(i.pid); if (!p) err('Produit introuvable : ' + i.name); if (availOf(p) < i.qty) err('Stock insuffisant pour « ' + p.name + ' » : ' + availOf(p) + ' disponible(s), ' + i.qty + ' demandé(s).'); }
  for (const i of o.items) mv(prod(i.pid), 'reservation', 0, i.qty, 'Réservation ' + o.no, o.id);
  o.reserved = true;
}
function doRelease(o) {
  if (!o.reserved) return;
  for (const i of o.items) mv(prod(i.pid), 'liberation', 0, -i.qty, 'Libération ' + o.no, o.id);
  o.reserved = false;
}
function doDeliver(o) {
  if (o.saleId || S.sales.some(s => s.orderId === o.id)) return; // jamais deux ventes pour une commande
  if (!o.reserved) err('La commande doit être confirmée (stock réservé) avant la livraison.');
  const items = [];
  for (const i of o.items) {
    const p = prod(i.pid); i.cost = costOf(p);
    mv(p, 'vente', -i.qty, -i.qty, 'Livraison ' + o.no, o.id);
    items.push({ pid: i.pid, name: i.name, cat: i.cat, qty: i.qty, price: i.price, cost: i.cost });
  }
  const sale = { id: uid('s'), no: 'V-' + pad(++S.seq.sale), orderId: o.id, orderNo: o.no, date: nowIso(), items, discount: o.discount || 0, shipFee: o.shipFee || 0,
    revenue: itemsTotal(o) - (o.discount || 0), cogs: sum(items, i => i.qty * i.cost), channel: o.channel, source: o.source, customer: o.name, returned: null };
  S.sales.push(sale); o.saleId = sale.id; o.reserved = false;
  o.delivery.deliveredDate = today();
}
function setStatusRaw(o, st, note) { const from = o.status; o.status = st; o.hist.push({ date: nowIso(), from, to: st, note: note || '' }); L('Statut commande', o.no, from + ' → ' + st + (note ? ' (' + note + ')' : '')); }

A.createOrder = d => {
  const name = (d.name || '').trim(); if (!name) err('Le nom du client est obligatoire.');
  const map = new Map();
  for (const it of d.items || []) {
    const p = prod(it.pid); if (!p || p.archived) err('Produit introuvable.');
    const q = num(it.qty), pr = num(it.price);
    if (q < 1) err('Quantité invalide pour ' + p.name + '.'); if (pr < 0) err('Prix invalide pour ' + p.name + '.');
    const k = p.id + '|' + pr; if (map.has(k)) map.get(k).qty += q; else map.set(k, { pid: p.id, name: p.name, cat: p.cat, qty: q, price: pr, cost: null });
  }
  const items = [...map.values()]; if (!items.length) err('Ajoutez au moins un produit.');
  const discount = num(d.discount), shipFee = num(d.shipFee);
  if (discount < 0 || shipFee < 0) err('Montant négatif impossible.');
  const gross = sum(items, i => i.qty * i.price); if (discount > gross) err('La réduction dépasse le total des produits.');
  const total = gross - discount + shipFee;
  const pay = num(d.payAmount); if (pay < 0) err('Montant payé invalide.'); if (pay > total) err('Le montant payé dépasse le total de la commande.');
  const phone = (d.phone || '').trim();
  const sig = items.map(i => i.pid + 'x' + i.qty).join(',');
  if (S.orders.some(x => Date.now() - Date.parse(x.date) < 60000 && digits(x.phone) === digits(phone) && x.name === name && orderTotal(x) === total && x.items.map(i => i.pid + 'x' + i.qty).join(',') === sig)) err('Une commande identique vient d\'être enregistrée.');
  if (d.instant) for (const i of items) { const p = prod(i.pid); if (availOf(p) < i.qty) err('Stock insuffisant pour « ' + p.name + ' » : ' + availOf(p) + ' disponible(s).'); }
  const c = upsertCustomer(name, phone, d.zone);
  const o = { id: uid('o'), no: 'CMD-' + pad(++S.seq.order), date: nowIso(), custId: c.id, name, phone, zone: (d.zone || '').trim(),
    source: d.source || 'Autre', channel: d.channel || '', items, discount, shipFee, mode: d.mode || 'Espèces', notes: (d.notes || '').trim(),
    status: 'Nouvelle commande', payments: [], reserved: false, saleId: null, returnInfo: null,
    delivery: { carrier: '', tracking: '', shipDate: '', fee: 0, deliveredDate: '', comment: '' }, hist: [] };
  S.orders.push(o); L('Commande créée', o.no, name + ' · ' + F(total));
  if (pay > 0) A.addPayment(o.id, { amount: pay, method: d.mode || 'Espèces', note: 'Paiement à la création' });
  if (d.instant) { A.setStatus(o.id, 'Confirmée'); A.setStatus(o.id, 'En préparation'); A.setStatus(o.id, 'Prête à expédier'); A.setStatus(o.id, 'En livraison'); A.setStatus(o.id, 'Livrée'); }
  return o;
};
A.updateOrder = (id, d) => {
  const o = ord(id); if (inactive(o) || o.status === 'Livrée') err('Cette commande ne peut plus être modifiée.');
  const name = (d.name || '').trim(); if (!name) err('Le nom du client est obligatoire.');
  const discount = num(d.discount), shipFee = num(d.shipFee); if (discount < 0 || shipFee < 0) err('Montant négatif impossible.');
  if (o.status === 'Nouvelle commande' && d.items) {
    const map = new Map();
    for (const it of d.items) { const p = prod(it.pid) || err('Produit introuvable.'); const q = num(it.qty), pr = num(it.price); if (q < 1) err('Quantité invalide.'); if (pr < 0) err('Prix invalide.'); const k = p.id + '|' + pr; if (map.has(k)) map.get(k).qty += q; else map.set(k, { pid: p.id, name: p.name, cat: p.cat, qty: q, price: pr, cost: null }); }
    if (!map.size) err('Ajoutez au moins un produit.'); o.items = [...map.values()];
  }
  if (discount > itemsTotal(o)) err('La réduction dépasse le total des produits.');
  const newTotal = itemsTotal(o) - discount + shipFee; if (paidOf(o) > newTotal) err('Le total ne peut pas descendre sous le montant déjà payé (' + F(paidOf(o)) + ').');
  const c = upsertCustomer(name, d.phone, d.zone);
  Object.assign(o, { name, phone: (d.phone || '').trim(), zone: (d.zone || '').trim(), custId: c.id, source: d.source || o.source, channel: d.channel || '', discount, shipFee, mode: d.mode || o.mode, notes: (d.notes || '').trim() });
  L('Commande modifiée', o.no); return o;
};
A.setStatus = (id, st, note) => {
  const o = ord(id);
  if (!FLOW[o.status].includes(st)) err('Passage impossible : ' + o.status + ' → ' + st + '.');
  if (st === 'Confirmée') doReserve(o);
  else if (st === 'Annulée') doRelease(o);
  else if (st === 'En livraison') o.delivery.shipDate = o.delivery.shipDate || today();
  else if (st === 'Livrée') { doDeliver(o); if (remaining(o) > 0) A.ensureOrderDebt(o); }
  setStatusRaw(o, st, note); return o;
};
A.addPayment = (id, d) => {
  const o = ord(id); let a = num(d.amount); if (a <= 0) err('Montant invalide.'); if (!d.method) err('Choisissez le moyen de paiement.');
  if (d.type === 'refund') { if (a > paidOf(o)) err('Remboursement supérieur au montant encaissé (' + F(paidOf(o)) + ').'); a = -a; }
  else { if (inactive(o)) err('Commande annulée ou retournée : aucun encaissement possible.'); if (a > remaining(o)) err('Le montant dépasse le reste à payer (' + F(remaining(o)) + ').'); }
  if (o.payments.some(p => !p.void && p.amount === a && p.method === d.method && Date.now() - p.ts < 15000)) err('Paiement identique enregistré à l\'instant.');
  o.payments.push({ id: uid('pay'), ts: Date.now(), date: d.date || today(), amount: a, method: d.method, note: (d.note || '').trim(), void: null });
  L(a < 0 ? 'Remboursement' : 'Encaissement', o.no, F(Math.abs(a)) + ' · ' + d.method);
  if (a > 0 && remaining(o) > 0 && !inactive(o)) A.ensureOrderDebt(o);
  return o;
};
A.saveDelivery = (id, d) => {
  const o = ord(id); const fee = num(d.fee); if (fee < 0) err('Frais invalides.');
  Object.assign(o.delivery, { carrier: (d.carrier || '').trim(), tracking: (d.tracking || '').trim(), shipDate: d.shipDate || '', fee, deliveredDate: d.deliveredDate || o.delivery.deliveredDate, comment: (d.comment || '').trim() });
  L('Livraison mise à jour', o.no, 'Frais payés ' + F(fee)); return o;
};
A.processReturn = (id, d) => {
  const o = ord(id); if (o.status !== 'Retour à traiter') err('Cette commande n\'est pas à l\'état « Retour à traiter ».');
  const was = !!o.saleId; const lines = [];
  for (const i of o.items) {
    const x = (d.items || []).find(z => z.pid === i.pid); const r = num(x ? x.resell : 0);
    if (r < 0 || r > i.qty) err('Quantité revendable invalide pour ' + i.name + '.'); lines.push({ i, r });
  }
  const refund = num(d.refund); if (refund < 0 || refund > paidOf(o)) err('Remboursement invalide (max ' + F(paidOf(o)) + ').');
  if (refund > 0 && !d.method) err('Choisissez le moyen de remboursement.');
  if (!was) doRelease(o);
  for (const { i, r } of lines) {
    const p = prod(i.pid), cost = i.cost != null ? i.cost : costOf(p), lost = i.qty - r;
    if (was) { if (r > 0) mv(p, 'retour', r, 0, 'Retour ' + o.no + ' (revendable)', o.id); if (lost > 0) mv(p, 'perte', 0, 0, 'Retour ' + o.no + ' : non récupéré / non revendable', o.id, lost * cost); }
    else if (lost > 0) mv(p, 'perte', -lost, 0, 'Retour ' + o.no + ' : non récupéré / non revendable', o.id, lost * cost);
  }
  if (was) { const s = S.sales.find(x => x.id === o.saleId); if (s) s.returned = nowIso(); }
  if (refund > 0) A.addPayment(o.id, { amount: refund, method: d.method, type: 'refund', note: 'Remboursement retour' });
  o.returnInfo = { date: nowIso(), note: (d.note || '').trim(), lines: lines.map(({ i, r }) => ({ pid: i.pid, name: i.name, qty: i.qty, resell: r })), refund };
  setStatusRaw(o, 'Retournée', d.note); return o;
};

/* ================= DÉPENSES ================= */
A.saveExpense = (id, d) => {
  const amount = num(d.amount); if (amount <= 0) err('Le montant doit être supérieur à 0.');
  const cat = EXP_CATS.find(c => c.n === d.cat) ? d.cat : err('Choisissez une catégorie.');
  if (!d.date) err('La date est obligatoire.');
  if (cat === 'Livraison' && d.orderId) err('Les frais de livraison d\'une commande se saisissent dans la fiche « Livraison » de la commande (pour ne pas les compter deux fois).');
  const rec = { date: d.date, cat, amount, desc: (d.desc || '').trim(), method: d.method || 'Espèces', proof: d.proof || '', orderId: d.orderId || '', pid: d.pid || '', inc: !!d.inc };
  if (id) { const e = S.expenses.find(x => x.id === id); if (e.void) err('Dépense annulée : non modifiable.'); const proof = d.proof === null || d.proof === undefined ? e.proof : d.proof; Object.assign(e, rec, { proof }); L('Dépense modifiée', cat, F(amount)); return e; }
  if (S.expenses.some(e => !e.void && e.date === rec.date && e.cat === cat && e.amount === amount && e.desc === rec.desc && Date.now() - e.ts < 15000)) err('Dépense identique enregistrée à l\'instant.');
  const e = { id: uid('e'), ts: Date.now(), ...rec, void: null }; S.expenses.push(e); L('Dépense créée', cat, F(amount)); return e;
};
A.voidExpense = (id, reason) => {
  const e = S.expenses.find(x => x.id === id) || err('Dépense introuvable.'); if (!(reason || '').trim()) err('Indiquez le motif de l\'annulation.');
  e.void = { date: nowIso(), reason: reason.trim() }; L('Dépense annulée', e.cat, F(e.amount) + ' (' + reason.trim() + ')');
};

A.saveChannel = (id, d) => {
  const name = (d.name || '').trim(); if (!name) err('Le nom est obligatoire.');
  if (S.channels.some(c => c.id !== id && c.name.toLowerCase() === name.toLowerCase())) err('Ce nom existe déjà.');
  if (id) { const c = S.channels.find(x => x.id === id); c.name = name; c.active = d.active !== false; L('Canal modifié', name); return c; }
  const c = { id: uid('ch'), name, active: true }; S.channels.push(c); L('Canal créé', name); return c;
};

/* ================= PÉRIODES ET INDICATEURS ================= */
function range(P) {
  const t = today();
  if (P.key === 'today') return [t, t];
  if (P.key === 'week') { const m = monday(t); return [m, addDays(m, 6)]; }
  if (P.key === 'month') return [t.slice(0, 7) + '-01', t.slice(0, 7) + '-31'];
  return [P.from || '0000-00-00', P.to || '9999-12-31'];
}
const inR = (d, r) => !!d && d.slice(0, 10) >= r[0] && d.slice(0, 10) <= r[1];

function metrics(r) {
  const sales = S.sales.filter(s => !s.returned && inR(s.date, r));
  const ca = sum(sales, s => s.revenue), cogs = sum(sales, s => s.cogs), brut = ca - cogs;
  const shipBilled = sum(sales, s => s.shipFee);
  const exps = S.expenses.filter(e => !e.void && inR(e.date, r));
  const opex = sum(exps.filter(e => !e.inc), e => e.amount), purchases = sum(exps.filter(e => e.inc), e => e.amount);
  const delivPaid = sum(S.orders.filter(o => o.delivery.fee > 0 && inR(o.delivery.shipDate || o.date, r)), o => o.delivery.fee);
  const losses = sum(S.moves.filter(m => m.type === 'perte' && inR(m.date, r)), m => m.val);
  const debtIn = sum(S.debts.filter(d => d.type === 'receivable' && !d.orderId).flatMap(d => d.payments.filter(p => !p.void && inR(p.date, r))), p => p.amount);
  const cashIn = sum(S.orders.flatMap(o => o.payments.filter(p => !p.void && inR(p.date, r))), p => p.amount) + debtIn;
  const missingCost = sum(sales, s => s.items.filter(i => !i.cost).length);
  return { sales, ca, cogs, brut, shipBilled, opex, purchases, delivPaid, losses, cashIn, missingCost,
    result: brut + shipBilled - opex - delivPaid - losses, exps };
}
const stockValue = () => sum(S.products.filter(p => !p.archived), p => p.qty * costOf(p));



A.voidPayment = (oid, pid, reason) => {

/* ================= DETTES ET CRÉANCES ================= */
/* Une créance liée à une commande n'a pas de registre de paiements propre : elle lit celui de la commande
   (un seul enregistrement par encaissement, aucune seconde vente, aucun doublon possible). */
const dOrder = d => d.orderId ? S.orders.find(o => o.id === d.orderId) : null;
const dAmount = d => { const o = dOrder(d); return o ? orderTotal(o) : d.amount; };
const dPays = d => { const o = dOrder(d); return o ? o.payments : d.payments; };
const dPaid = d => sum(dPays(d).filter(p => !p.void), p => p.amount);
const dCancelled = d => { const o = dOrder(d); return !!(d.cancelled || (o && inactive(o))); };

function dStatus(d) {
  if (dCancelled(d)) return 'Annulée'; if (d.disputed) return 'Contestée';
  const a = dAmount(d), p = dPaid(d);
  if (a > 0 && p >= a) return 'Entièrement payée';
  if (d.due && d.due < today()) return 'En retard';
  return p > 0 ? 'Partiellement payée' : 'Non payée';
}
const debtFor = oid => S.debts.find(d => d.orderId === oid);
const dHist = (d, action, detail) => { d.hist.push({ date: nowIso(), action, detail: detail || '' }); };
function cleanDebt(d, cur) {
  const name = (d.name || '').trim(); if (!name) err('Le nom est obligatoire.');
  const created = d.created || today(), due = d.due || '';

  return { name, phone: (d.phone || '').trim(), reason: (d.reason || '').trim(), created, due, method: d.method || 'Espèces', notes: (d.notes || '').trim() };
}
A.saveDebt = (id, d) => {

    const ch = [];
    if (!x.orderId) { const a = num(d.amount); if (a <= 0) err('Le montant doit être supérieur à 0.'); if (a < dPaid(x)) err('Le montant initial ne peut pas être inférieur au total déjà payé (' + F(dPaid(x)) + ').'); if (a !== x.amount) { ch.push('montant ' + F(x.amount) + ' → ' + F(a)); x.amount = a; } }
    if (c.due !== x.due) ch.push('échéance ' + (x.due ? fd(x.due) : '—') + ' → ' + (c.due ? fd(c.due) : '—'));
    Object.assign(x, c); if (x.type === 'receivable' && !x.orderId) { x.custId = upsertCustomer(c.name, c.phone, '').id; }

  }

  let x;

    x.reason = x.reason || 'Commande ' + o.no;

    x = { id: uid('d'), ts: Date.now(), type, ...c, amount, orderId: '', custId: type === 'receivable' ? upsertCustomer(c.name, c.phone, '').id : '', payments: [], hist: [], cancelled: null, disputed: false };
    if (paid0 > 0) x.payments.push({ id: uid('dp'), ts: Date.now(), date: c.created, amount: paid0, method: c.method, ref: '', note: 'Paiement initial', void: null });

};
A.ensureOrderDebt = (o, due) => {

  const x = { id: uid('d'), ts: Date.now(), type: 'receivable', name: o.name, phone: o.phone, reason: 'Commande ' + o.no, amount: 0, created: today(),

A.syncDebts = () => { let n = 0; for (const o of S.orders) if (!inactive(o) && !debtFor(o.id) && remaining(o) > 0 && (paidOf(o) > 0 || o.status === 'Livrée')) { A.ensureOrderDebt(o); n++; } return n; };
A.payDebt = (id, d) => {
  const x = S.debts.find(y => y.id === id) || err('Introuvable.'); if (dCancelled(x)) err('Dossier annulé.');
  const a = num(d.amount); if (a <= 0) err('Le montant doit être supérieur à 0.'); if (!d.method) err('Choisissez le moyen de paiement.');

A.voidDebtPayment = (id, pid, reason) => {
  const x = S.debts.find(y => y.id === id) || err('Introuvable.'); if (!(reason || '').trim()) err('Indiquez le motif de l\'annulation.');

A.cancelDebt = (id, reason) => {

A.setDisputed = (id, flag, note) => { const x = S.debts.find(y => y.id === id) || err('Introuvable.'); x.disputed = !!flag; dHist(x, flag ? 'Marquée contestée' : 'Contestation levée', note || ''); L(flag ? 'Contestation' : 'Contestation levée', x.name); };
function debtMetrics() {
  const rec = S.debts.filter(d => d.type === 'receivable' && !dCancelled(d)), pay = S.debts.filter(d => d.type === 'payable' && !dCancelled(d)), t = today(), soon = addDays(t, S.settings.soonDays);

    paySoon: pay.filter(d => dBalance(d) > 0 && d.due && d.due >= t && d.due <= soon && !d.disputed).length, recSoon: rec.filter(d => dBalance(d) > 0 && d.due && d.due >= t && d.due <= soon && !d.disputed).length };

/* ================= COHÉRENCE ================= */
function checkStock() {
  const out = [];
  for (const p of S.products) {
    const calc = sum(S.moves.filter(m => m.pid === p.id), m => m.dq);
    if (calc !== p.qty) out.push(p.name + ' : stock ' + p.qty + ' ≠ somme des mouvements ' + calc);
    if (p.qty < 0) out.push(p.name + ' : stock négatif');
    const rcalc = sum(S.moves.filter(m => m.pid === p.id), m => m.dr);
    if (rcalc !== reservedOf(p.id)) out.push(p.name + ' : réservé ' + reservedOf(p.id) + ' ≠ mouvements ' + rcalc);
  }
  const dseen = new Set();
  for (const d of S.debts) { if (d.orderId) { if (dseen.has(d.orderId)) out.push('Créance en double pour la commande ' + d.orderId); dseen.add(d.orderId); } if (dPaid(d) > dAmount(d) && !dCancelled(d)) out.push('Créance/dette « ' + d.name + ' » : payé supérieur au montant'); }
  const seen = new Set();
  for (const s of S.sales) { if (seen.has(s.orderId)) out.push('Vente en double pour ' + s.orderNo); seen.add(s.orderId); }
  for (const o of S.orders) if (o.saleId && !S.sales.some(s => s.id === o.saleId)) out.push('Vente manquante pour ' + o.no);
  return out;
}

A.lotAlloc = d => {
  const lines = (d.lines || []).map(l => ({ pid: l.pid, qty: num(l.qty), buy: num(l.buy) })), fees = num(d.transport) + num(d.customs) + num(d.other);
  const byQty = d.split === 'qty'; let w = lines.map(l => byQty ? l.qty : l.qty * l.buy), sw = sum(w, x => x);
  if (sw <= 0) { w = lines.map(l => l.qty); sw = sum(w, x => x); }
  return lines.map((l, i) => { const share = sw ? fees * w[i] / sw : 0, impUnit = l.qty ? Math.round(share / l.qty) : 0; return { ...l, share: Math.round(share), impUnit, cost: l.buy + impUnit }; });
};
A.receiveLot = d => {
  if (!(d.lines || []).length) err('Ajoutez au moins un produit à l\'arrivage.');
  const seen = new Set();
  for (const l of d.lines) { const p = prod(l.pid) || err('Produit introuvable.'); if (seen.has(l.pid)) err('Produit en double : ' + p.name + '.'); seen.add(l.pid); if (num(l.qty) < 1) err('Quantité invalide pour ' + p.name + '.'); if (num(l.buy) < 0 || String(l.buy).trim() === '') err('Prix d\'achat manquant pour ' + p.name + '.'); }
  for (const k of ['transport', 'customs', 'other']) if (num(d[k]) < 0) err('Frais négatifs impossibles.');
  const date = d.date || today(), alloc = A.lotAlloc(d), no = 'ARR-' + pad(++S.seq.lot, 4), sup = (d.supplier || '').trim();
  if (S.lots.some(x => Date.now() - x.ts < 15000 && x.lines.map(l => l.pid + 'x' + l.qty).join() === alloc.map(l => l.pid + 'x' + l.qty).join() && x.supplier === sup)) { S.seq.lot--; err('Cet arrivage vient d\'être enregistré.'); }
  for (const l of alloc) A.moveStock(l.pid, { type: 'entree', qty: l.qty, buy: l.buy, imp: l.impUnit, note: 'Arrivage ' + no + (sup ? ' · ' + sup : '') });
  const lot = { id: uid('lot'), ts: Date.now(), no, date, supplier: sup, lines: alloc.map(l => ({ pid: l.pid, name: prod(l.pid).name, qty: l.qty, buy: l.buy, impUnit: l.impUnit, share: l.share })),

};

/* ================= RÉAPPROVISIONNEMENT ================= */
function restockList() {
  const t = today(), from = addDays(t, -30), sold = new Map(), ever = new Map();
  for (const s of S.sales) if (!s.returned) for (const i of s.items) { ever.set(i.pid, (ever.get(i.pid) || 0) + i.qty); if (s.date.slice(0, 10) >= from) sold.set(i.pid, (sold.get(i.pid) || 0) + i.qty); }
  const lead = S.settings.leadDays, keep = S.settings.restockDays, out = [];
  for (const p of S.products) {
    if (p.archived) continue; const q30 = sold.get(p.id) || 0, perDay = q30 / 30, av = availOf(p), cover = perDay > 0 ? av / perDay : Infinity;
    if (!(perDay > 0 || (av <= 0 && ever.get(p.id)))) continue;
    const need = perDay > 0 ? Math.max(0, Math.ceil(perDay * (lead + keep)) - av) : 0;
    const level = av <= 0 ? 'urgent' : cover < lead ? 'urgent' : cover < lead + keep ? 'soon' : 'ok';
    if (level === 'ok' && !need) continue; out.push({ p, q30, perDay, av, cover, need, level });
  }
  return out.sort((a, b) => a.cover - b.cover);
}

/* ---------- retour utilisateur ---------- */
function toast(m, kind) { $('#toast').innerHTML = ''; const d = document.createElement('div'); d.textContent = m; if (kind === 'err') d.className = 'err'; $('#toast').appendChild(d); setTimeout(() => d.remove(), kind === 'err' ? 5200 : 2800); }
let lockUntil = 0;
function G(fn) { return function (...a) { if (Date.now() < lockUntil) return; lockUntil = Date.now() + 450; try { return fn.apply(this, a); } catch (e) { lockUntil = 0; toast(e.message || 'Erreur', 'err'); if (!(e instanceof Error) || !e.message) console.error(e); } }; }

const sheets = [];

function drawSheet() {

  if (!sheets.length) { root.innerHTML = ''; document.body.style.overflow = ''; return; }

}
const rangeLabel = r => r[0] === r[1] ? fd(r[0]) : fd(r[0]) + ' → ' + (r[1].endsWith('-31') && U.period.key === 'month' ? 'fin du mois' : fd(r[1]));

/* ---------- graphiques ---------- */
function hbars(items, fmt = F) {
  if (!items.length) return `<p class="mut">Aucune donnée sur cette période.</p>`;
  const max = Math.max(1, ...items.map(i => i.value));
  return `<div class="hb">${items.map(i => `<div><div class="l"><span>${esc(i.label)}</span><b>${fmt(i.value)}</b></div><div class="t"><i style="width:${Math.max(2, i.value / max * 100)}%"></i></div></div>`).join('')}</div>`;
}
function vbars(r, sales) {
  let from = r[0], to = r[1] > today() ? today() : r[1]; if (from === '0000-00-00') from = sales.length ? sales.map(s => s.date).sort()[0].slice(0, 10) : to;
  const days = []; for (let d = from; d <= to && days.length < 800; d = addDays(d, 1)) days.push(d);
  const byMonth = days.length > 62; const map = new Map();
  for (const d of days) map.set(byMonth ? d.slice(0, 7) : d, 0);
  for (const s of sales) { const k = byMonth ? s.date.slice(0, 7) : s.date.slice(0, 10); if (map.has(k)) map.set(k, map.get(k) + s.revenue); }
  const data = [...map.entries()]; if (!data.length || data.every(x => x[1] === 0)) return `<p class="mut">Aucune vente sur cette période.</p>`;
  const W = 320, H = 132, pl = 4, pr = 4, pt = 16, pb = 20, max = Math.max(...data.map(d => d[1])), bw = (W - pl - pr) / data.length, ch = H - pt - pb;
  const lab = k => byMonth ? k.slice(5) + '/' + k.slice(2, 4) : k.slice(8) + '/' + k.slice(5, 7);
  const bars = data.map(([k, v], i) => { const h = Math.max(v ? 2 : 0, v / max * ch); return `<rect class="b ${i === data.length - 1 ? 'last' : ''}" x="${(pl + i * bw + bw * .16).toFixed(1)}" y="${(pt + ch - h).toFixed(1)}" width="${(bw * .68).toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${lab(k)} : ${F(v)}</title></rect>`; }).join('');
  const mid = Math.floor(data.length / 2);
  return `<svg class="vb" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution du chiffre d'affaires"><line x1="${pl}" x2="${W - pr}" y1="${pt + ch}" y2="${pt + ch}"/><text x="${pl}" y="10">Pic : ${F(max)}</text>${bars}
  <text x="${pl}" y="${H - 5}">${lab(data[0][0])}</text>${data.length > 4 ? `<text x="${W / 2}" y="${H - 5}" text-anchor="middle">${lab(data[mid][0])}</text>` : ''}<text x="${W - pr}" y="${H - 5}" text-anchor="end">${lab(data[data.length - 1][0])}</text></svg>`;
}
function topProducts(sales, n = 6) { const m = new Map(); for (const s of sales) for (const i of s.items) { const a = m.get(i.name) || { q: 0, ca: 0 }; a.q += i.qty; a.ca += i.qty * i.price; m.set(i.name, a); } return [...m.entries()].sort((a, b) => b[1].q - a[1].q).slice(0, n).map(([k, v]) => ({ label: k, value: v.q, ca: v.ca })); }
function topCats(sales) { const m = new Map(); for (const s of sales) for (const i of s.items) m.set(i.cat, (m.get(i.cat) || 0) + i.qty * i.price); return [...m.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: k, value: v })); }
function expByCat(m) { const t = new Map(); for (const e of m.exps.filter(e => !e.inc)) t.set(e.cat, (t.get(e.cat) || 0) + e.amount); if (m.delivPaid) t.set('Livraison (commandes)', (t.get('Livraison (commandes)') || 0) + m.delivPaid); return [...t.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: k, value: v })); }

/* ============ STOCK ============ */
function prodCard(p) {
  const st = stockState(p), a = availOf(p), res = reservedOf(p.id);
  return `<button class="item" data-act="product" data-id="${p.id}">${thumb(p)}<div class="grow"><div class="nm">${esc(p.name)}</div><div class="sub">${esc(p.sku)} · ${esc(p.cat)}${p.channel ? ' · ' + esc(chName(p.channel)) : ''}</div><div class="sub">Coût ${F(costOf(p))} · Prix ${F(p.price)}</div></div>
  <div class="amt">${a}<small>${st === 'out' ? pill('Rupture', 'bad') : st === 'low' ? pill('Stock faible', 'warn') : 'dispo'}${res ? `<br>${res} réservé${res > 1 ? 's' : ''}` : ''}</small></div></button>`;
}
function stockList() {
  let L = S.products.filter(p => !p.archived); const q = U.q.trim().toLowerCase();
  if (q) L = L.filter(p => (p.name + ' ' + p.sku + ' ' + p.supplier).toLowerCase().includes(q));
  if (U.cat) L = L.filter(p => p.cat === U.cat);
  if (U.stockTab === 'low') L = L.filter(p => stockState(p) === 'low'); if (U.stockTab === 'out') L = L.filter(p => stockState(p) === 'out');

/* ============ VENTES ============ */
function salesFiltered(r) {
  return S.sales.filter(s => inR(s.date, r) && (!U.sFilter.ch || s.channel === U.sFilter.ch) && (!U.sFilter.cat || s.items.some(i => i.cat === U.sFilter.cat)) && (!U.sFilter.pid || s.items.some(i => i.pid === U.sFilter.pid)));
}
function salesList() {
  const r = range(U.period), L = salesFiltered(r).sort((a, b) => b.date.localeCompare(a.date));
  if (!S.sales.length) return empty('Aucune vente', 'Une vente est enregistrée automatiquement quand une commande est livrée.', `<button class="btn p" data-act="newOrder">${I('plus')} Nouvelle commande</button>`);
  if (!L.length) return empty('Aucune vente', 'Aucune vente ne correspond à ces filtres.');
  const act = L.filter(s => !s.returned), ca = sum(act, s => s.revenue), br = ca - sum(act, s => s.cogs);
  return `<div class="tiles"><div class="tile"><small>Chiffre d'affaires</small><b>${F(ca)}</b></div><div class="tile"><small>Bénéfice brut estimé</small><b>${F(br)}</b></div></div>` +
    L.map(s => { const o = S.orders.find(x => x.id === s.orderId); const modes = o ? [...new Set(o.payments.filter(p => p.amount > 0 && !p.void).map(p => p.method))].join(', ') || o.mode : '';
      return `<button class="item" data-act="sale" data-id="${s.id}"><div class="grow"><div class="row sp wrapx"><b>${s.no}</b>${s.returned ? pill('Retournée', 'bad') : ''}</div><div class="sub">${ft(s.date)} · ${esc(chName(s.channel))} · ${esc(modes)}</div><div class="sub">${s.items.map(i => esc(i.name) + ' ×' + i.qty).join(', ')}</div></div><div class="amt ${s.returned ? 'strike' : ''}">${F(s.revenue)}<small>marge ${F(s.revenue - s.cogs)}</small></div></button>`; }).join('');
}
function scSales() {
  U.listFn = salesList; const cats = [...new Set(S.products.map(p => p.cat))].sort();
  return `${periodBar()}<div class="g2"><label class="f"><select id="sf_ch" data-sf="ch" aria-label="Canal"><option value="">Tous les canaux</option>${S.channels.map(c => `<option value="${c.id}" ${U.sFilter.ch === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
  <label class="f"><select id="sf_cat" data-sf="cat" aria-label="Catégorie"><option value="">Toutes catégories</option>${cats.map(c => `<option ${U.sFilter.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label></div>
  <label class="f"><select id="sf_pid" data-sf="pid" aria-label="Produit"><option value="">Tous les produits</option>${S.products.map(p => `<option value="${p.id}" ${U.sFilter.pid === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
  <div class="list" id="list">${salesList()}</div>`;
}
function sheetSale(id) {
  openSheet('Vente', () => { const s = S.sales.find(x => x.id === id), o = S.orders.find(x => x.id === s.orderId); return `<div class="row sp"><div><div style="font:800 22px var(--font-d)">${s.no}</div><div class="sub mut">${ft(s.date)} · commande ${s.orderNo}</div></div>${s.returned ? pill('Retournée', 'bad') : pill('Vendue', 'good')}</div>
  <div class="card flat">${s.items.map(i => `<div class="kv"><span>${esc(i.name)} × ${i.qty}<br><small>Prix ${F(i.price)} · coût ${F(i.cost)}${i.cost ? '' : ' (non renseigné)'}</small></span><b>${F(i.qty * i.price)}</b></div>`).join('')}
  ${kv('Réduction', F(s.discount))}${kv('Chiffre d\'affaires', F(s.revenue), 'tot')}${kv('Coût de revient', F(s.cogs))}${kv('Bénéfice brut estimé', F(s.revenue - s.cogs))}${kv('Frais de livraison facturés', F(s.shipFee))}${kv('Frais de livraison payés', F(o ? o.delivery.fee : 0))}${kv('Canal', esc(chName(s.channel)))}${kv('Source', esc(s.source))}${kv('Mode de paiement', esc(o ? ([...new Set(o.payments.filter(p => p.amount > 0 && !p.void).map(p => p.method))].join(', ') || o.mode + ' (non encaissé)') : ''))}${kv('Client', esc(s.customer))}</div>
  ${o ? `<div class="btns"><button class="btn" data-act="order" data-id="${o.id}">Voir la commande</button><button class="btn" data-act="receipt" data-id="${o.id}">Reçu WhatsApp</button></div>` : ''}`; });
}

/* ============ MENU ET SOUS-PAGES ============ */
function scMenu() {
  const rows = [['customers', 'users', 'Clients', S.customers.length + ' enregistré(s)'], ['expenses', 'wallet', 'Dépenses', 'Achats, publicité, emballages…'], ['deliveries', 'truck', 'Livraisons', 'Suivi des expéditions'], ['debts', 'wallet', 'Dettes et créances', recapDebts()], ['reports', 'chart', 'Rapports', 'Bénéfices, créances, exports CSV'], ['channels', 'store', 'Boutiques et canaux', 'TikTok, WhatsApp, vente directe'], ...EXTRA_MENU(), ['settings', 'gear', 'Paramètres', 'Sauvegarde, code d\'accès'], ['log', 'clock', 'Historique des modifications', 'Journal des opérations']];
  const days = S.lastBackup ? Math.floor((Date.now() - Date.parse(S.lastBackup)) / 86400000) : null;
  const warn = (S.products.length || S.orders.length) && (days === null || days > 7) ? `<button class="alert warn" data-act="sub" data-v="settings">${I('download')}<span>${days === null ? 'Aucune sauvegarde exportée' : 'Dernière sauvegarde il y a ' + days + ' jours'} : exportez-en une</span>${I('chev')}</button>` : '';
  return `${warn}<div class="menu">${rows.map(([k, ic, t, s]) => `<button class="item" data-act="sub" data-v="${k}"><div class="th">${I(ic)}</div><div class="grow"><div class="nm">${t}</div><div class="sub">${s}</div></div>${I('chev')}</button>`).join('')}</div>`;
}
/* clients */
function custStats(c) { const os = custOrders(c).filter(o => !['Annulée'].includes(o.status)); return { n: os.length, total: sum(os.filter(o => o.status !== 'Retournée'), orderTotal), due: sum(os, remaining) + sum(S.debts.filter(d => d.type === 'receivable' && !d.orderId && d.custId === c.id), dBalance), first: custOrders(c).map(o => o.date).sort()[0] || c.created }; }
function custList() {
  const q = U.custQ.trim().toLowerCase(); let L = S.customers.filter(c => !q || (c.name + ' ' + c.phone).toLowerCase().includes(q) || digits(c.phone).includes(digits(q)) && digits(q));
  if (!S.customers.length) return empty('Aucun client', 'Les clients sont ajoutés automatiquement avec leurs commandes.', `<button class="btn p" data-act="newCust">${I('plus')} Ajouter un client</button>`);
  return L.length ? L.map(c => { const s = custStats(c); return `<button class="item" data-act="cust" data-id="${c.id}"><div class="th">${esc(c.name.charAt(0).toUpperCase())}</div><div class="grow"><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.phone || 'Sans téléphone')}${c.zone ? ' · ' + esc(c.zone) : ''}</div><div class="sub">${fdl(s.n, 'commande')}</div></div><div class="amt">${F(s.total)}${s.due ? `<small style="color:var(--bad)">dû ${F(s.due)}</small>` : ''}</div></button>`; }).join('') : empty('Aucun résultat', '');
}
function scCustomers() { U.listFn = custList; return `<div class="search">${I('search')}<input id="q" type="search" placeholder="Nom ou téléphone" value="${esc(U.custQ)}" data-live="custQ"></div><div class="list" id="list">${custList()}</div><button class="fab" data-act="newCust">${I('plus')} Client</button>`; }
function sheetCust(id) {
  openSheet('Client', () => { const c = S.customers.find(x => x.id === id), s = custStats(c), os = custOrders(c).sort((a, b) => b.date.localeCompare(a.date));
    return `<div style="font:800 21px var(--font-d)">${esc(c.name)}</div><div class="card flat">${kv('Téléphone', esc(c.phone || '—'))}${kv('Adresse / zone', esc(c.zone || '—'))}${kv('Première commande', fd(s.first))}${kv('Nombre de commandes', s.n)}${kv('Total des achats', F(s.total))}${kv('Montant restant dû', F(s.due))}</div>
    <div class="btns"><button class="btn" data-act="editCust" data-id="${id}">Modifier</button><button class="btn p" data-act="newOrderFor" data-id="${id}">Nouvelle commande</button><button class="btn full" data-act="crmMsg" data-id="${id}">Message WhatsApp</button></div>
    <div class="sec-h"><h2>Historique</h2></div><div class="list">${os.map(ordCard).join('') || '<p class="mut">Aucune commande.</p>'}</div>`; });
}
function custForm(id) { openSheet(id ? 'Modifier le client' : 'Nouveau client', () => { const c = id ? S.customers.find(x => x.id === id) : {}; return `<form class="stack" data-form="cust" data-id="${id || ''}">${fld('Nom', 'name', c.name || '', { req: 1 })}${fld('Téléphone', 'phone', c.phone || '', { attrs: 'inputmode="tel"' })}${fld('Adresse ou zone', 'zone', c.zone || '')}<button class="btn p full">Enregistrer</button></form>`; }); }
/* dépenses */
function scExpenses() {
  const r = range(U.period), m = metrics(r), L = S.expenses.filter(e => inR(e.date, r)).sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  const by = {}; L.forEach(e => (by[e.date] = by[e.date] || []).push(e));
  return `${periodBar()}<div class="tiles"><div class="tile"><small>Dépenses opérationnelles</small><b>${F(m.opex)}</b></div><div class="tile"><small>Livraisons payées</small><b>${F(m.delivPaid)}</b><em>depuis les commandes</em></div><div class="tile"><small>Achats de stock</small><b>${F(m.purchases)}</b><em>non déduits du résultat</em></div><div class="tile"><small>Pertes (retours)</small><b>${F(m.losses)}</b></div></div>
  <div class="card stack"><div class="sec-h"><h2>Par catégorie</h2></div>${hbars(expByCat(m))}</div>
  ${L.length ? Object.keys(by).map(d => `<div class="dayh"><span>${fd(d)}</span><span>${F(sum(by[d].filter(e => !e.void), e => e.amount))}</span></div>` + by[d].map(e => `<button class="item" data-act="expense" data-id="${e.id}"><div class="grow"><div class="nm ${e.void ? 'strike' : ''}">${esc(e.cat)}</div><div class="sub">${esc(e.desc || e.method)}${e.inc ? ' · inclus dans le coût de revient' : ''}${e.void ? ' · annulée' : ''}</div></div><div class="amt ${e.void ? 'strike' : ''}">${F(e.amount)}</div></button>`).join('')).join('') : empty('Aucune dépense', 'Aucune dépense enregistrée sur cette période.', `<button class="btn p" data-act="newExpense">${I('plus')} Ajouter une dépense</button>`)}
  <button class="fab" data-act="newExpense">${I('plus')} Dépense</button>`;
}

/* livraisons */
function scDeliveries() {
  const L = S.orders.filter(o => ['Prête à expédier', 'En livraison', 'Livrée', 'Retour à traiter'].includes(o.status) || o.delivery.carrier || o.delivery.fee).sort((a, b) => b.date.localeCompare(a.date));
  const ds = o => ({ 'Prête à expédier': 'À expédier', 'En livraison': 'En cours', 'Livrée': 'Livrée', 'Retour à traiter': 'Retour', 'Retournée': 'Retour', 'Annulée': 'Annulée' }[o.status] || 'En préparation');
  const act = L.filter(o => ['Prête à expédier', 'En livraison'].includes(o.status));
  return `<div class="tiles"><div class="tile"><small>À expédier / en cours</small><b>${act.length}</b></div><div class="tile"><small>Frais payés (total)</small><b>${F(sum(S.orders, o => o.delivery.fee))}</b></div></div>
  <div class="list">${L.length ? L.map(o => `<button class="item" data-act="deliv" data-id="${o.id}"><div class="grow"><div class="row sp wrapx"><b>${o.no} · ${esc(o.name)}</b>${pill(ds(o), stKind(o.status))}</div><div class="sub">${esc(o.zone || 'Zone non renseignée')}</div><div class="sub">${esc(o.delivery.carrier || 'Transporteur non renseigné')}${o.delivery.tracking ? ' · ' + esc(o.delivery.tracking) : ''}</div></div><div class="amt">${F(o.delivery.fee)}<small>frais payés</small></div></button>`).join('') : empty('Aucune livraison', 'Les commandes prêtes à expédier apparaissent ici.')}</div>`;
}
/* canaux */

function channelForm(id) { openSheet(id ? 'Modifier le canal' : 'Nouveau canal', () => { const c = id ? S.channels.find(x => x.id === id) : { name: '', active: true }; return `<form class="stack" data-form="channel" data-id="${id || ''}">${fld('Nom', 'name', c.name, { req: 1 })}${id ? `<label class="row" style="gap:10px"><input type="checkbox" name="active" id="f_active" style="width:22px;height:22px" ${c.active ? 'checked' : ''}><span>Canal actif (proposé dans les formulaires)</span></label>` : ''}<button class="btn p full">Enregistrer</button></form>`; }); }
/* historique */
function scLog() { const L = S.log.slice(-200).reverse(); return L.length ? `<div class="list">${L.map(l => `<div class="card flat"><div class="row sp wrapx"><b>${esc(l.action)}</b><span class="sub mut">${ft(l.date)}</span></div><div class="sub">${esc(l.ref)}${l.detail ? ' · ' + esc(l.detail) : ''}</div></div>`).join('')}</div>` : empty('Journal vide', 'Les opérations importantes seront listées ici.'); }

/* ============ RAPPORTS ============ */
function scReports() {
  const r = range(U.period), m = metrics(r), all = S.products.filter(p => !p.archived);
  const days = new Map(); m.sales.forEach(s => days.set(s.date.slice(0, 10), (days.get(s.date.slice(0, 10)) || 0) + s.revenue));
  const weeks = new Map(); m.sales.forEach(s => { const k = monday(s.date.slice(0, 10)); weeks.set(k, (weeks.get(k) || 0) + s.revenue); });
  const months = new Map(); m.sales.forEach(s => { const k = s.date.slice(0, 7); months.set(k, (months.get(k) || 0) + s.revenue); });
  const lst = (mp, f) => [...mp.entries()].sort().reverse().slice(0, 14).map(([k, v]) => `<div class="kv"><span>${f(k)}</span><b>${F(v)}</b></div>`).join('') || '<p class="mut">Aucune vente.</p>';
  const cap = all.filter(p => p.qty > 0).sort((a, b) => b.qty * costOf(b) - a.qty * costOf(a)).slice(0, 8).map(p => ({ label: p.name + ' (' + p.qty + ' u.)', value: p.qty * costOf(p) }));
  const canc = S.orders.filter(o => o.status === 'Annulée' && inR(o.date, r)), ret = S.orders.filter(o => ['Retour à traiter', 'Retournée'].includes(o.status) && inR(o.date, r));
  const chan = S.channels.map(c => { const ss = m.sales.filter(s => s.channel === c.id); return { label: c.name, value: sum(ss, s => s.revenue), brut: sum(ss, s => s.revenue - s.cogs), n: S.orders.filter(o => o.channel === c.id && inR(o.date, r) && o.status !== 'Annulée').length }; }).filter(x => x.value || x.n);
  const cred = S.orders.filter(o => o.status === 'Livrée' && remaining(o) > 0).sort((a, b) => remaining(b) - remaining(a));
  const exp = key => `<button class="btn s" data-act="export" data-k="${key}">${I('download')} ${key.charAt(0).toUpperCase() + key.slice(1)} (CSV)</button>`;
  return `${periodBar()}
  <div class="card"><div class="sec-h"><h2>Bénéfices estimés</h2><small>${rangeLabel(r)}</small></div>
  ${kv('Chiffre d\'affaires (produits)', F(m.ca))}${kv('Coût des produits vendus', '− ' + F(m.cogs))}${kv('Bénéfice brut', F(m.brut), 'tot')}${kv('+ Livraison facturée aux clients', F(m.shipBilled))}${kv('− Dépenses opérationnelles', F(m.opex))}${kv('− Livraison payée', F(m.delivPaid))}${kv('− Pertes (retours)', F(m.losses))}${kv('Résultat estimé', F(m.result), 'tot')}
  ${kv('Encaissements de la période', F(m.cashIn))}${kv('Créances clients (livrées)', F(receivables()))}${kv('Valeur du stock (coût)', F(stockValue()))}${kv('Achats de stock enregistrés', F(m.purchases))}</div>
  ${m.missingCost ? `<div class="note">${fdl(m.missingCost, 'ligne')} vendue(s) sans coût de revient : le bénéfice est surévalué. Renseignez le prix d'achat des produits concernés.</div>` : ''}
  <div class="card stack"><div class="sec-h"><h2>Ventes par jour</h2></div>${lst(days, fd)}<div class="sec-h"><h2>par semaine</h2></div>${lst(weeks, k => 'Semaine du ' + fd(k))}<div class="sec-h"><h2>par mois</h2></div>${lst(months, k => k.slice(5) + '/' + k.slice(0, 4))}</div>
  <div class="card stack"><div class="sec-h"><h2>Produits les plus vendus</h2></div>${hbars(topProducts(m.sales, 8), n => n + ' u.')}</div>
  <div class="card stack"><div class="sec-h"><h2>Capital immobilisé</h2><small>stock au coût</small></div>${hbars(cap)}</div>
  <div class="card"><div class="sec-h"><h2>État du stock</h2></div>${kv('Produits actifs', all.length)}${kv('Stock faible', all.filter(p => stockState(p) === 'low').length)}${kv('En rupture', all.filter(p => stockState(p) === 'out').length)}${kv('Valeur au coût', F(stockValue()))}${kv('Valeur au prix de vente', F(sum(all, p => p.qty * p.price)))}</div>
  <div class="card"><div class="sec-h"><h2>Commandes annulées</h2></div>${kv('Nombre', canc.length)}${kv('Valeur', F(sum(canc, orderTotal)))}</div>
  <div class="card"><div class="sec-h"><h2>Retours</h2></div>${kv('Nombre', ret.length)}${kv('Pertes sur retours', F(m.losses))}</div>
  <div class="card stack"><div class="sec-h"><h2>Performance par canal</h2></div>${chan.length ? chan.map(c => `<div class="kv"><span>${esc(c.label)}<br><small>${fdl(c.n, 'commande')} · marge ${F(c.brut)}</small></span><b>${F(c.value)}</b></div>`).join('') : '<p class="mut">Aucune donnée.</p>'}</div>
  <div class="card stack"><div class="sec-h"><h2>Créances clients</h2><small>${F(receivables())}</small></div>${cred.length ? cred.map(o => `<button class="item" data-act="order" data-id="${o.id}"><div class="grow"><b>${o.no} · ${esc(o.name)}</b><div class="sub">${esc(o.phone)}</div></div><div class="amt">${F(remaining(o))}</div></button>`).join('') : '<p class="mut">Aucune créance.</p>'}</div>

}

}

  r.readAsText(file);

const FONT = (w, s) => `${w} ${s}px Figtree, "Segoe UI", Roboto, system-ui, sans-serif`;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, h); x.textBaseline = 'alphabetic'; return [c, x]; }
function fit(x, text, max) { let t = String(text); if (x.measureText(t).width <= max) return t; while (t.length > 1 && x.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; }
function rrect(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }

function crmMessage(c, kind) {
  const first = c.name.trim().split(/\s+/)[0];
  return kind === 'idle' ? `Bonjour ${first},\n\nÇa fait un moment ! Chez ${S.settings.company}, de nouveaux arrivages viennent d'arriver. Voulez-vous que je vous envoie le catalogue ?\n\nMerci pour votre confiance.\n${S.settings.company}`
    : `Bonjour ${first},\n\nMerci pour votre fidélité à ${S.settings.company} ! Nous avons de nouveaux produits et je serais ravi de vous les présenter en premier. Souhaitez-vous voir le catalogue ?\n\nBelle journée !\n${S.settings.company}`;
}

/* ---------- actions ---------- */
Object.assign(ACT, {
  receipt: d => receiptSheet(d.id),
  receiptImg: async d => { const o = ord(d.id); toast('Création du reçu…'); const c = await receiptCanvas(o); imgSheet('Reçu en image · ' + o.no, [c], 'recu-' + o.no, receiptText(o), false); },
  imgGo: async d => { const c = IMGS[+d.i]; const r = await deliver(await toBlob(c), d.base + (IMGS.length > 1 ? '-' + (+d.i + 1) : '') + '.png', 'image/png', window.__imgText); if (r === 'échec') toast('Enregistrement impossible : appuyez longuement sur l\'image', 'err'); else if (r !== 'annulé') toast('Image ' + r); },
  pdfGo: async d => { const c = IMGS[+d.i]; const r = await deliver(pdfFromCanvas(c), d.base + (IMGS.length > 1 ? '-' + (+d.i + 1) : '') + '.pdf', 'application/pdf', ''); if (r === 'échec') toast('Enregistrement du PDF impossible', 'err'); else if (r !== 'annulé') toast('PDF ' + r); },
  reportImg: async () => { toast('Création du rapport…'); const r = range(U.period); const c = await reportCanvas(r); imgSheet('Rapport en image / PDF', [c], 'rapport-skonciss-' + today(), reportText(), true); },
  newLot: () => { newLot(); openSheet('Nouvel arrivage', lotForm); }, lot: d => sheetLot(d.id),
  lotAdd: () => { const v = $('#lpick') && $('#lpick').value; if (!v) return toast('Choisissez un produit', 'err'); const p = prod(v); LD.lines.push({ pid: v, qty: '', buy: p.buy || '' }); drawSheet(); },
  lotRm: d => { LD.lines.splice(+d.i, 1); drawSheet(); },
  restockLot: () => { const R = restockList().filter(r => r.need > 0); newLot(R.map(r => ({ pid: r.p.id, qty: r.need, buy: r.p.buy || '' }))); openSheet('Nouvel arrivage', lotForm); },
  restockCopy: () => { const t = ['Produits à recommander (' + fd(today()) + ')', ...restockList().filter(r => r.need > 0).map(r => '• ' + r.p.name + ' : ' + r.need + ' unités (stock ' + r.av + ', ' + r.q30 + ' vendus en 30 j)')].join('\n'); showText('Liste à recommander', t); },
  catAll: d => { const all = S.products.filter(p => !p.archived && availOf(p) > 0); CATSEL = d.v === '1' ? new Set(all.map(p => p.id)) : new Set(); drawMain(); },
  catText: () => { const ids = [...CATSEL]; if (!ids.length) return toast('Cochez au moins un produit', 'err'); msgSheet('Catalogue en texte', '', catalogText(ids), ''); },
  catImg: async () => { const ids = [...CATSEL]; if (!ids.length) return toast('Cochez au moins un produit', 'err'); toast('Création du catalogue…'); const pages = await catPages(ids); imgSheet('Catalogue en image', pages, 'catalogue-skonciss', catalogText(ids), false); },
  crmTab: d => { CRMTAB = d.v; drawMain(); },
  crmMsg: d => { const c = S.customers.find(x => x.id === d.id), st = crmData().find(x => x.c.id === c.id); const kind = st && st.days >= S.settings.inactiveDays ? 'idle' : 'best';
    msgSheet('Message à ' + c.name, c.phone, crmMessage(c, kind), `<div class="kv"><span>Client</span><b>${esc(c.name)}</b></div><div class="kv"><span>Téléphone</span><b>${esc(c.phone || 'non renseigné')}</b></div>${st ? `<div class="kv"><span>Achats livrés</span><b>${F(st.total)} · ${fdl(st.n, 'commande')}</b></div>` : ''}`); }
});
function sheetLot(id) {
  openSheet('Arrivage', () => { const l = S.lots.find(x => x.id === id); return `<div class="row sp"><div><div style="font:800 22px var(--font-d)">${l.no}</div><div class="sub mut">${fd(l.date)}${l.supplier ? ' · ' + esc(l.supplier) : ''}</div></div></div>
    <div class="card flat">${l.lines.map(x => `<div class="kv"><span>${esc(x.name)} × ${x.qty}<br><small>achat ${F(x.buy)} + frais ${F(x.impUnit)} / unité</small></span><b>${F(x.qty * (x.buy + x.impUnit))}</b></div>`).join('')}${kv('Transport international', F(l.transport))}${kv('Dédouanement', F(l.customs))}${kv('Autres frais', F(l.other))}${kv('Répartition', l.split === 'qty' ? 'selon les unités' : 'selon la valeur d\'achat')}${kv('Dépenses enregistrées', l.recorded ? 'oui' : 'non')}${l.note ? kv('Note', esc(l.note)) : ''}</div>`; });
}
FORMS.lot = G((f, el) => { const d = { ...LD, supplier: LD.supplier, date: LD.date }; A.receiveLot(d); toast('Arrivage enregistré · stock et coûts mis à jour'); closeSheet(); refresh(); });

/* ---------- saisie ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.mm) { const a = $('#mm_go'); window.__txt = t.value; if (a) a.href = (waNum(t.dataset.phone) ? waLink(t.dataset.phone, t.value) : 'https://wa.me/?text=' + encodeURIComponent(t.value)); return; }
  if (t.dataset.ld && LD) { LD[t.dataset.ld] = t.type === 'checkbox' ? t.checked : t.value; if (t.dataset.redraw) { const pos = t.selectionStart; drawSheet(); const n = $('#lq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; } const p = $('#lp'); if (p) p.innerHTML = lotPreview(); return; }
  if (t.dataset.ll && LD) { const [i, k] = t.dataset.ll.split(':'); LD.lines[+i][k] = t.value; const p = $('#lp'); if (p) p.innerHTML = lotPreview(); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.cat && CATSEL) { t.checked ? CATSEL.add(t.dataset.cat) : CATSEL.delete(t.dataset.cat); } if (t.dataset.ld && LD && t.tagName === 'SELECT') { LD[t.dataset.ld] = t.value; const p = $('#lp'); if (p) p.innerHTML = lotPreview(); } });
Object.assign(window.SK, { restockList, crmData, lotAlloc: A.lotAlloc, receiptText, catalogText, pdfFromCanvas, receiptCanvas, reportCanvas, catPages });

</script></body></html>
